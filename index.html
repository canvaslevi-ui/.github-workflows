<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Levi Interiors Admin</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{font-family:system-ui;background:#0f172a;color:#fff;margin:0;}
.header{background:#020617;padding:15px;text-align:center;font-weight:bold;}
.container{padding:12px;}

.card{background:#1e293b;padding:12px;border-radius:10px;margin-bottom:10px;}

input,select,button{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:none;
  border-radius:8px;
}

button{background:#3b82f6;color:#fff;font-weight:bold;cursor:pointer;}

.project-item{
  background:#111827;
  padding:12px;
  margin:6px 0;
  border-radius:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.project-actions{
  display:flex;
  gap:6px;
}

.delete-btn{
  background:#ef4444;
}

.status{
  font-size:12px;
  margin-top:4px;
  font-weight:500;
}

.pending{color:#f59e0b;}
.progress{color:#3b82f6;}
.done{color:#10b981;}

.dashboard{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}

.box{padding:10px;border-radius:10px;text-align:center;}
.pending-bg{background:#f59e0b;}
.cutting-bg{background:#3b82f6;}
.dispatch-bg{background:#10b981;}

/* TOAST */
#toast{
  position:fixed;
  top:20px;
  right:20px;
  background:#22c55e;
  color:#fff;
  padding:12px 18px;
  border-radius:8px;
  opacity:0;
  transform:translateY(-20px);
  transition:0.3s;
}

#toast.show{
  opacity:1;
  transform:translateY(0);
}

#toast.error{
  background:#ef4444;
}
</style>
</head>

<body>

<div class="header">🔥 Levi Interiors Admin</div>

<div class="container">

<div class="card">
<input id="projectName" placeholder="Project Name">
<input type="file" id="file">
<button onclick="upload()">Upload Excel</button>
</div>

<div class="card">
📊 Total Projects: <span id="totalProjects">0</span>
</div>

<div class="dashboard">
  <div class="box pending-bg">Pending<br><span id="gPending">0</span></div>
  <div class="box cutting-bg">Cutting<br><span id="gCutting">0</span></div>
  <div class="box dispatch-bg">Dispatch<br><span id="gDispatch">0</span></div>
</div>

<div class="card">
<input id="searchProject" placeholder="🔍 Search Projects..." oninput="renderProjectList()">
</div>

<div class="card">
<b>📂 All Projects</b>
<div id="projectList"></div>
</div>

</div>

<div id="toast"></div>

<script>

const API = "https://levi-api-zhbu.onrender.com";
const socket = io(API);

socket.on("refresh", loadProjects);

let projects=[];

// TOAST
function showToast(msg,type="success"){
  let t=document.getElementById("toast");
  t.innerText=msg;
  t.className="show";
  if(type==="error") t.classList.add("error");
  setTimeout(()=>t.className="",3000);
}

// CLEAN
function clean(v){
  return parseFloat(String(v).replace(/[^0-9.]/g,''))||0;
}

// EXPAND
function expand(id){
  return id.split(",").flatMap(p=>{
    p=p.replace("#","").trim();
    if(p.includes("-")){
      let[s,e]=p.split("-").map(Number);
      return Array.from({length:e-s+1},(_,i)=>"#"+(s+i));
    }
    return["#"+p];
  });
}

// UPLOAD
async function upload(){

let name=projectName.value;
let file=document.getElementById("file").files[0];

if(!name||!file){
  showToast("Fill all fields","error");
  return;
}

let reader=new FileReader();

reader.onload=async e=>{
try{

let wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
let rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});

let hi=rows.findIndex(r=>r.join("").toLowerCase().includes("panel"));
let h=rows[hi].map(x=>x.toLowerCase());

let pi=h.findIndex(x=>x.includes("panel"));
let li=h.findIndex(x=>x.includes("length"));
let wi=h.findIndex(x=>x.includes("width"));
let qi=h.findIndex(x=>x.includes("qty"));

let project={name,panels:[]};

for(let i=hi+1;i<rows.length;i++){
let r=rows[i];
if(!r[pi]) continue;

let ids=expand(r[pi]);
let len=clean(r[li]);
let wid=clean(r[wi]);
let qty=parseInt(clean(r[qi]));

ids.forEach((id,index)=>{
project.panels.push({
id,
status:"pending",
items:[{length:len,width:wid,seq:index+1}],
totalGroupQty:qty
});
});
}

let res=await fetch(API+"/api/projects",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(project)
});

let data=await res.json();

if(data.success){
  showToast("Upload Success");
  loadProjects();
}else{
  showToast("Upload Failed","error");
}

}catch{
  showToast("File Error","error");
}
};

reader.readAsArrayBuffer(file);
}

// LOAD PROJECTS
async function loadProjects(){

let res=await fetch(API+"/api/projects");
let data=await res.json();

projects=data.data;

// TOTAL PROJECT
totalProjects.innerText = projects.length;

// GLOBAL COUNTS
let gPending=0,gCutting=0,gDispatch=0;

projects.forEach(p=>{
  p.panels.forEach(panel=>{
    if(panel.status==="pending") gPending++;
    if(panel.status==="cutting") gCutting++;
    if(panel.status==="dispatched") gDispatch++;
  });
});

gPendingEl.innerText=gPending;
gCuttingEl.innerText=gCutting;
gDispatchEl.innerText=gDispatch;

renderProjectList();
}

// PROJECT LIST WITH STATUS
function renderProjectList(){

let search=document.getElementById("searchProject").value.toLowerCase();

let html="";

projects
.filter(p=>p.name.toLowerCase().includes(search))
.forEach(p=>{

let total=p.panels.length;
let done=p.panels.filter(x=>x.status==="dispatched").length;
let started=p.panels.filter(x=>x.status!=="pending").length;

let status="Pending",cls="pending";

if(done===total && total>0){
  status="Completed"; cls="done";
}
else if(started>0){
  status="In Progress"; cls="progress";
}

html+=`
<div class="project-item">
  <div>
    <div>${p.name}</div>
    <div class="status ${cls}">${status}</div>
  </div>

  <div class="project-actions">
    <button onclick="selectProject('${p._id}')">Open</button>
    <button class="delete-btn" onclick="deleteProject('${p._id}')">Delete</button>
  </div>
</div>
`;
});

projectList.innerHTML=html||"No projects found";
}

// SELECT
function selectProject(id){
showToast("Opened: "+id);
}

// DELETE
async function deleteProject(id){
if(!confirm("Delete project?")) return;
await fetch(API+"/api/projects/"+id,{method:"DELETE"});
showToast("Project Deleted");
loadProjects();
}

const gPendingEl=document.getElementById("gPending");
const gCuttingEl=document.getElementById("gCutting");
const gDispatchEl=document.getElementById("gDispatch");

window.onload=loadProjects;

</script>

</body>
</html>
