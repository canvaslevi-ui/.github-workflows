<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Levi Interiors Admin</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{font-family:system-ui;background:#0f172a;color:#fff;margin:0;}
.header{background:#020617;padding:15px;text-align:center;font-weight:bold;}
.container{padding:12px;}

.card{background:#1e293b;padding:12px;border-radius:10px;margin-bottom:10px;}

input,select,button{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:none;
  border-radius:8px;
}

button{background:#3b82f6;color:#fff;font-weight:bold;cursor:pointer;}

.dashboard{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}

.box{padding:10px;border-radius:10px;text-align:center;}
.pending{background:#f59e0b;}
.cutting{background:#3b82f6;}
.dispatch{background:#10b981;}

.panel{background:#111827;padding:10px;border-radius:8px;margin:8px 0;}

.project-item{
  background:#111827;
  padding:10px;
  margin:6px 0;
  border-radius:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.project-actions{
  display:flex;
  gap:6px;
}

.delete-btn{
  background:#ef4444;
}

/* 🔥 TOAST */
#toast{
  position:fixed;
  top:20px;
  right:20px;
  background:#22c55e;
  color:#fff;
  padding:12px 18px;
  border-radius:8px;
  font-size:14px;
  opacity:0;
  transform:translateY(-20px);
  transition:all 0.3s ease;
  z-index:9999;
}

#toast.show{
  opacity:1;
  transform:translateY(0);
}

#toast.error{
  background:#ef4444;
}
</style>
</head>

<body>

<div class="header">🔥 Levi Interiors Admin</div>

<div class="container">

<!-- UPLOAD -->
<div class="card">
<input id="projectName" placeholder="Project Name">
<input type="file" id="file">
<button onclick="upload()">Upload Excel</button>
</div>

<!-- SELECT -->
<div class="card">
<select id="projectSelect" onchange="loadProject()"></select>
</div>

<!-- TOTAL -->
<div class="card">
📊 Total Projects: <span id="totalProjects">0</span>
</div>

<!-- PROJECT LIST -->
<div class="card">
<b>📂 All Projects</b>
<div id="projectList"></div>
</div>

<!-- DASHBOARD -->
<div class="dashboard">
<div class="box pending">Pending<br><span id="pending">0</span></div>
<div class="box cutting">Cutting<br><span id="cutting">0</span></div>
<div class="box dispatch">Dispatch<br><span id="dispatch">0</span></div>
</div>

<div id="list"></div>

</div>

<!-- 🔥 TOAST -->
<div id="toast"></div>

<script>

const API = "https://levi-api-zhbu.onrender.com";
const socket = io(API);

socket.on("refresh", loadProjects);

let projects=[];

// 🔔 TOAST FUNCTION
function showToast(msg,type="success"){
  const t=document.getElementById("toast");
  t.innerText=msg;
  t.className="show";
  if(type==="error") t.classList.add("error");

  setTimeout(()=>{
    t.className="";
  },3000);
}

// CLEAN
function clean(v){
  return parseFloat(String(v).replace(/[^0-9.]/g,''))||0;
}

// EXPAND
function expand(id){
  return id.split(",").flatMap(p=>{
    p=p.replace("#","").trim();
    if(p.includes("-")){
      let[s,e]=p.split("-").map(Number);
      return Array.from({length:e-s+1},(_,i)=>"#"+(s+i));
    }
    return["#"+p];
  });
}

// UPLOAD
async function upload(){

let name=projectName.value;
let file=document.getElementById("file").files[0];

if(!name||!file){
  showToast("Fill all fields","error");
  return;
}

let reader=new FileReader();

reader.onload=async e=>{
try{

let wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
let rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});

let hi=rows.findIndex(r=>r.join("").toLowerCase().includes("panel"));
let h=rows[hi].map(x=>x.toLowerCase());

let pi=h.findIndex(x=>x.includes("panel"));
let li=h.findIndex(x=>x.includes("length"));
let wi=h.findIndex(x=>x.includes("width"));
let qi=h.findIndex(x=>x.includes("qty"));

let project={name,panels:[]};

for(let i=hi+1;i<rows.length;i++){
let r=rows[i];
if(!r[pi]) continue;

let ids=expand(r[pi]);
let len=clean(r[li]);
let wid=clean(r[wi]);
let qty=parseInt(clean(r[qi]));

ids.forEach((id,index)=>{
project.panels.push({
id,
status:"pending",
items:[{length:len,width:wid,seq:index+1}],
totalGroupQty:qty
});
});
}

let res=await fetch(API+"/api/projects",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(project)
});

let data=await res.json();

if(data.success){
  showToast("Upload Success");
  loadProjects();
}else{
  showToast("Upload Failed","error");
}

}catch{
  showToast("File Error","error");
}
};

reader.readAsArrayBuffer(file);
}

// LOAD PROJECTS
async function loadProjects(){

let res=await fetch(API+"/api/projects");
let data=await res.json();

projects=data.data;

totalProjects.innerText=projects.length;

projectSelect.innerHTML="";
projects.forEach(p=>{
projectSelect.innerHTML+=`<option value="${p._id}">${p.name}</option>`;
});

renderProjectList();
loadProject();
}

// PROJECT LIST
function renderProjectList(){

let html="";

projects.forEach(p=>{
html+=`
<div class="project-item">
  <span>${p.name}</span>
  <div class="project-actions">
    <button onclick="selectProject('${p._id}')">Open</button>
    <button class="delete-btn" onclick="deleteProject('${p._id}')">Delete</button>
  </div>
</div>
`;
});

projectList.innerHTML=html;
}

// SELECT
function selectProject(id){
projectSelect.value=id;
loadProject();
}

// DELETE
async function deleteProject(id){

if(!confirm("Delete project?")) return;

await fetch(API+"/api/projects/"+id,{method:"DELETE"});

showToast("Project Deleted");
loadProjects();
}

// LOAD PROJECT
function loadProject(){

let id=projectSelect.value;
let p=projects.find(x=>x._id===id);

let html="",pending=0,cutting=0,dispatch=0;

p?.panels.forEach(panel=>{
let i=panel.items[0];

if(panel.status==="pending") pending++;
if(panel.status==="cutting") cutting++;
if(panel.status==="dispatched") dispatch++;

html+=`<div class="panel"><b>${panel.id}</b><br>${i.seq}/${panel.totalGroupQty}</div>`;
});

list.innerHTML=html;

pendingEl.innerText=pending;
cuttingEl.innerText=cutting;
dispatchEl.innerText=dispatch;
}

const pendingEl=document.getElementById("pending");
const cuttingEl=document.getElementById("cutting");
const dispatchEl=document.getElementById("dispatch");

window.onload=loadProjects;

</script>

</body>
</html>
